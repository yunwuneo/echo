name: Companion
options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, Base]
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: 6
    SWIFT_VERSION: '6.0'
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    ECHO_UI_BASE_URL: http://127.0.0.1:3012
    APNS_ENVIRONMENT: sandbox
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 用于你批准的日历查询与编辑
    INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 用于你批准的提醒事项查询与编辑
    INFOPLIST_KEY_NSContactsUsageDescription: 用于你批准的联系人查找与新建
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于你选择的照片与元数据查询
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于你请求的位置与天气
    INFOPLIST_KEY_NSLocationUsageDescription: 用于你请求的位置与天气
    INFOPLIST_KEY_NSHealthShareUsageDescription: 用于你明确选择的健康指标读取
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: 用于你批准的健康数据写入
    INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于录制你明确开始的语音对话
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将语音转换为可编辑文本
    INFOPLIST_KEY_EchoPushEnvironment: $(APNS_ENVIRONMENT)
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ''
packages:
  CompanionCore:
    path: Packages/CompanionCore
targets:
  Companion-iOS:
    type: application
    productName: Echo
    platform: iOS
    sources: [Shared, iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          [dev.echo2.companion.refresh-schedules]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo2.companion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        CODE_SIGN_ENTITLEMENTS: iOS/Echo.entitlements
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: YES
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
        PRODUCT_NAME: Echo
        INFOPLIST_KEY_CFBundleDisplayName: Echo
        INFOPLIST_KEY_CFBundleName: Echo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: CompanionCore
      - target: EchoShare
        embed: true
      - target: EchoWidgets
        embed: true
  EchoShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared/SystemInbox.swift]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 保存到 Echo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo2.companion.ios.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Echo.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ECHO_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: CompanionCore
  EchoWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Echo 任务状态
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo2.companion.ios.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Echo.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: CompanionCore
  Companion-macOS:
    type: application
    productName: Echo
    platform: macOS
    sources: [Shared, macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo2.companion.macos
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        CODE_SIGN_ENTITLEMENTS: macOS/Echo.entitlements
        PRODUCT_NAME: Echo
        INFOPLIST_KEY_CFBundleDisplayName: Echo
        INFOPLIST_KEY_CFBundleName: Echo
    dependencies:
      - package: CompanionCore
  Companion-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Companion-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo2.companion.ios.uitests
        TEST_TARGET_NAME: Companion-iOS
  Companion-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Companion-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo2.companion.macos.uitests
        TEST_TARGET_NAME: Companion-macOS
schemes:
  Companion-iOS:
    build:
      targets:
        Companion-iOS: all
    test:
      environmentVariables:
        ECHO2_UI_TEST_BASE_URL: $(ECHO_UI_BASE_URL)
      targets: [Companion-iOS-UITests]
  Companion-macOS:
    build:
      targets:
        Companion-macOS: all
    test:
      environmentVariables:
        ECHO2_UI_TEST_BASE_URL: $(ECHO_UI_BASE_URL)
      targets: [Companion-macOS-UITests]
